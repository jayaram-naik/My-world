<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ರಾಧೇ..ರಾಧೇ ..!!</title>

<style>

    /* Kannada aesthetic font */
    @import url('https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Sacramento&display=swap'); /* Brush font */

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        font-family: "Poppins", sans-serif;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: linear-gradient(135deg, #000, #fff);
        overflow: hidden;
    }

    .container {
        max-width: 600px;
        padding: 20px;
        position: relative;
    }

    /* HOPE BEHIND POEM */
    .poem-container {
        position: relative;
        display: inline-block;
        padding: 20px 10px;
    }

    .poem-container::before {
    content: "Hope";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Sacramento', cursive;
    font-size: 180px;
    font-weight: bold;
    color: rgba(0, 70, 180, 0.35);  /* stronger & darker */
    z-index: -1;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0, 60, 160, 0.3);
}


    .poem {
        font-family: 'Baloo Tamma 2', sans-serif;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.5;
        color: #ffffff;
        text-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    .line {
        font-size: 17px;
        margin-bottom: 20px;
        opacity: 0.9;
        color: #000;
    }

    iframe {
        width: 100%;
        height: 315px;
        border: none;
        margin-top: 20px;
        border-radius: 10px;
    }

</style>

</head>
<body>

<div class="container">

    <!-- Kannada poem with HOPE behind -->
    <div class="poem-container">
        <div class="poem">
            ಮೆದುಳಿನ ನರ-ನಾಡಿಗಳು ನಿನ್ನ ಮರೆತರೂ <br>
            ಹೃದಯದ ಅಭಿಧಮನಿಗಳು ನೆನಪಿಸುವ ಅಧ್ಯಾಯ ನೀನು
        </div>
    </div>

    <div class="line">
        I can’t express my feelings in words…<br>
        but this song can. <br><br>
        Please close your eyes and feel it…<br>
        only when you feel loneliness. 💛
    </div>

    <!-- Loop same song forever -->
    <iframe 
       src="https://www.youtube.com/embed/xK6G81lwSBQ?autoplay=0&loop=1&playlist=xK6G81lwSBQ&controls=1&rel=0"
       allowfullscreen>
    </iframe>

</div>

</body>
</html>
